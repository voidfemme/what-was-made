# Bio-Magic — Canary overrides
#
# Canary and C2ME both rewrite the chunk system. Both place an @Redirect on
# DistanceManager.replaceStreams; C2ME's MixinChunkTicketManager registers at
# priority 1100 against Canary's 1000, so C2ME wins, Canary's redirect gets
# skipped, and because Canary declares it required the mixin apply hard-fails.
#
# The crash is a MixinTransformerError at ServerChunkCache.<init>, which is why
# it fires the instant you click Create World rather than at launch:
#
#   Critical injection failure: Redirector replaceStreams(...) in
#   canary.mixins.json:chunk.replace_streams.DistanceManagerMixin
#   failed injection check, (0/1) succeeded.
#
# This disables the whole chunk.replace_streams group — ChunkHolderMixin,
# DistanceManagerMixin, ServerEntityMixin, ServerLevelMixin, and the
# servercore_compat one. It's Canary's stream-to-loop rewrites in the chunk
# system, i.e. allocation churn, not a load-bearing optimization. C2ME is doing
# similar work in that area anyway.
#
# Confirm it took: the launch log should read
#   "Loaded configuration file for Canary: 116 options available, 1 override(s) found"
# It said 0 before this file existed.
#
# NOTE: this is config/canary.properties. canary.overrides.properties is a
# different mechanism, for OTHER MODS to override Canary's defaults, and Canary
# will not read your settings from it.
#
# The deeper question this papers over: C2ME-Forge is an unofficial alpha.12
# port paired with Lost Cities, the heaviest worldgen in the pack, and LC²H —
# the targeted Lost Cities multithreading fix — got dropped in the packwiz
# conversion. If chunk-related weirdness continues, dropping C2ME and re-adding
# LC²H is the more conservative pairing on this hardware.

mixin.chunk.replace_streams=false
